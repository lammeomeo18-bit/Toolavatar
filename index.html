<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>APP Jerry Mod 🐬</title>
<style>
:root{--bg:#070b16;--card:#0d1424;--line:#1c2740;--txt:#e8ecf6;--mut:#7d8aa8;--red:#ff6b6b;--gold:#f2c230;--green:#4ade80;--yel:#fbbf24;--org:#fb923c}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 400px at 20% -10%,#14204a 0,transparent 60%),var(--bg);color:var(--txt);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(16px,env(safe-area-inset-top)) 14px 40px}
.wrap{max-width:520px;margin:0 auto}
.head{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.logo{width:48px;height:48px;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#38bdf8,#8b5cf6);display:grid;place-items:center;font-weight:800;font-size:22px;color:#0b1020}
h1{margin:0;font-size:20px;letter-spacing:.2px}
.sub{color:var(--mut);font-size:12px;margin-top:2px}
.chip{display:inline-block;border:1px solid #155e75;color:#22d3ee;background:#0b2230;border-radius:8px;padding:4px 10px;font-size:11px;margin-bottom:14px}
html,body{touch-action:pan-y;-webkit-text-size-adjust:100%;overscroll-behavior-x:none}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(7,11,22,.55),rgba(7,11,22,.7)),url("https://i.ibb.co/6JVW7Jfd/IMG-1755-CODE-MAKE-AIM.png") center/cover no-repeat,var(--bg)}
.card{background:rgba(13,20,36,.88);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2{margin:0;font-size:15px}
button{font:inherit;color:var(--txt);background:#121b30;border:1px solid #26334f;border-radius:10px;padding:7px 12px;cursor:pointer}
button:active{transform:scale(.97)}
.stage{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:radial-gradient(circle at 50% 45%,#10244a 0,#070b16 70%);overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.sec{border-radius:14px;padding:12px;margin-bottom:14px;border:1px solid}
.sec.r{border-color:#5a2230;background:#130e1a}
.sec.g{border-color:#5a4a1a;background:#14120f}
.sec h3{margin:0;font-size:15px}
.r h3{color:var(--red)}.g h3{color:var(--gold)}
.badge{display:none!important}
.badge{font-size:11px;font-weight:700;border:1px solid;border-radius:999px;padding:4px 10px;margin-right:6px;white-space:nowrap}
.bar{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin:10px 0 12px}
.bar i{height:5px;border-radius:3px;background:#141c30}
.sl{margin:10px 0}
.sl .lab{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px}
.sl .val{font-variant-numeric:tabular-nums}
.r .val{color:var(--red)}.g .val{color:var(--gold)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;outline:none;margin:0;background:linear-gradient(90deg,var(--c) var(--p),#e5e7eb var(--p))}
.r input{--c:#ef6a6a}.g input{--c:#e0b81f}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 5px #0008;border:0}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 5px #0008}
.rad{border-top:1px dashed #2a3552;margin-top:14px;padding-top:12px}
input.val{background:transparent;border:0;border-bottom:1px dashed #3a4a70;width:104px;text-align:right;font:inherit;padding:2px 0;border-radius:0;-moz-appearance:textfield;appearance:textfield}
input.val::-webkit-inner-spin-button,input.val::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input.val:focus{outline:none;border-bottom-color:#fff}
.hint{color:var(--mut);font-size:14px;margin-top:10px}
.config-title{margin:0 0 10px;font-size:15px}
.config-tabs{display:flex;gap:8px}
.config-tab{flex:1;min-height:42px;font-weight:700;background:#10182b;border-color:#26334f}
.config-tab.active[data-panel="red"]{border-color:#ff6b6b;color:#ff8a8a;background:#2a141c}
.config-tab.active[data-panel="gold"]{border-color:#f2c230;color:#f5d45a;background:#27220f}
.sec.p{border-color:#4c2a7a;background:#120e1c}.p h3{color:#c084fc}.p .val{color:#c084fc}.p input{--c:#a855f7}
.config-tab.active[data-panel="spine"]{border-color:#a855f7;color:#c084fc;background:#1c1230}
.hexout textarea{display:block;width:100%;margin:4px 0 6px;padding:8px;border-radius:8px;border:1px solid #26334f;background:#060a14;color:#b9c6e4;font:11.5px/1.5 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;resize:vertical}
.hexout .hl{font-size:12.5px;color:var(--mut);margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hexout .hl button{padding:4px 10px;font-size:12px;min-height:30px;width:auto}
.sec.a{border-color:#14532d;background:#0c1612}.a h3{color:#4ade80}.a .val{color:#4ade80}.a input{--c:#22c55e}
.config-tab.active[data-panel="ant"]{border-color:#4ade80;color:#6ee7a0;background:#0f2418}
.edit #aiBtns button{margin-top:8px}
[hidden]{display:none!important}
.phide .params .sl:not(.sc) .lab,.phide .nud input.val{display:none!important}
pre{margin:12px 0 0;background:#060a14;border:1px solid var(--line);border-radius:10px;padding:12px;height:300px;overflow:auto;font:11.5px/1.55 ui-monospace,Menlo,Consolas,monospace;color:#b9c6e4;white-space:pre}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#16a34a;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.edit .file{display:block;border:1px dashed #3a4a70;border-radius:10px;padding:12px;text-align:center;color:#9fb0d6;cursor:pointer;margin-bottom:10px;word-break:break-all}
.edit .file input{display:none}
.edit .fld{display:block;font-size:12.5px;color:var(--mut);margin-bottom:10px}
.edit .fld input{display:block;width:100%;margin-top:5px;padding:10px;border-radius:10px;border:1px solid #26334f;background:#0a1020;color:var(--txt);font:13px ui-monospace,Menlo,Consolas,monospace}
.edit .info{font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;color:#b9c6e4;background:#060a14;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;white-space:pre-wrap;word-break:break-all}
.edit button{width:100%;min-height:44px;font-weight:700}
.edit button:disabled{opacity:.45}
.edit .bad{color:#f87171}
.rot{margin-top:12px}
.rot .row b{color:#38bdf8;font-variant-numeric:tabular-nums}
.rot input{--c:#38bdf8;--p:0%;margin:12px 0}
.rot .qb{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rot .qb button{padding:8px 4px;font-size:13px}
.rot .qb button.on{border-color:#38bdf8;color:#7dd3fc;background:#0f2230}
#sideStage{touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
</style>

</head>
<body>
<div class="wrap">
  <div class="head"><div class="logo"><img src="https://media1.tenor.com/m/mUf7iFh6V18AAAAC/ayla-beautiful.gif" alt="J" onerror="this.replaceWith('J')" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block"></div><div><h1>APP Jerry Mod 🐬</h1></div></div>

  <div class="card edit">
    <h2 class="config-title">📦 File assetindexer</h2>
    <label class="file"><input type="file" id="cacheFile"><span id="fileName">Chọn file assetindexer…</span></label>
    <div id="editInfo" class="info">Chưa chọn file.</div>
  </div>

  <div class="card" id="prevCard" hidden>
    <div class="row"><h2>🎯 Preview — Headshot &amp; Magic</h2><button id="resetAll">↩️ Reset</button></div>
    <div id="side">
      <div class="stage" id="sideStage"><svg viewBox="0 0 400 420" xmlns="http://www.w3.org/2000/svg">

        <g id="silh" fill="#1c2a4a" stroke="#34456b" stroke-width="1.5"><ellipse cx="200" cy="88" rx="22" ry="27"/><rect x="190" y="112" width="20" height="14" rx="4"/><rect x="180" y="124" width="40" height="112" rx="16"/><rect x="186" y="232" width="28" height="118" rx="10"/><ellipse cx="218" cy="356" rx="26" ry="7"/><rect x="195" y="132" width="12" height="100" rx="6"/></g>
        <line id="gline" x1="20" y1="363" x2="380" y2="363" stroke="#34456b" stroke-dasharray="4 4"/>
        <g fill="#7d8aa8" font-size="11"><text id="lblR" x="380" y="30" text-anchor="end">TRÁI NV →</text><text id="lblL" x="20" y="30">← PHẢI NV</text><text x="200" y="14" text-anchor="middle">TRÊN ↑</text><text x="200" y="414" text-anchor="middle">DƯỚI ↓</text></g>
        <circle id="par2" r="4" fill="#9aa5c0"/>
        <g id="ringS" style="display:none"><ellipse id="s2E" fill="#f2c23018" stroke="#f2c230" stroke-width="2" stroke-dasharray="5 4"/><circle id="s2C" fill="#ff6b6b18" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5 4"/><line id="s2L" stroke="#ff6b6b" stroke-width="2"/></g>
      </svg></div>
    </div>
  </div>

  <div class="card" id="cfgCard" hidden>
    <h2 class="config-title">⚙️ Cấu hình</h2>
    <div class="config-tabs" role="tablist" aria-label="Chọn cấu hình">
      <button class="config-tab" type="button" role="tab" aria-selected="false" aria-pressed="false" data-panel="red">🔴 Headshot — Đầu</button>
      <button class="config-tab" type="button" role="tab" aria-selected="false" aria-pressed="false" data-panel="gold" hidden>🟡 Magic — Thân</button>
      <button class="config-tab" type="button" role="tab" aria-selected="false" aria-pressed="false" data-panel="spine">🟣 Magic</button>
      <button class="config-tab" type="button" role="tab" aria-selected="false" aria-pressed="false" data-panel="ant" hidden>🟢 Antena</button>
    </div>
  </div>
  <div id="panels" hidden></div>
</div>

  if(mode!=='ant'){
    MV=TR[({head:'red',magic:'gold',spine:'spine'})[mode]].map((t,i)=>{const[lo,hi]=limOf(i,baseOf(i,({head:'red',magic:'gold',spine:'spine'})[mode]),({head:'red',magic:'gold',spine:'spine'})[mode]);return Math.fround(Math.min(hi,Math.max(lo,parseFloat(t))))});
    FV=MV.map((m,i)=>Math.fround(vo.getFloat32(L.female.el+4*i,true)+(m-vo.getFloat32(L.male.el+4*i,true))));
    if(FV.every((f,i)=>f===MV[i]))FV[0]=Math.fround(femVal(MV[0],FEM_OFF[0])); // Nữ không được trùng hoàn toàn Nam
  }
  for(const g of['male','female']){
    const b=L[g];
    if(mode==='ant'){const[lo,hi]=E33_LIM(),m=Math.min(hi,Math.max(lo,SA.e33));v.setFloat32(b.e33.off,g==='male'?m:femVal(m,FEM_E33),true);continue}
    (g==='male'?MV:FV).forEach((x,i)=>v.setFloat32(b.el+4*i,x,true));
    // Tên: GHI ĐÈ TẠI CHỖ, giữ nguyên trường độ dài chuỗi (vd 16) và bù 00 — KHÔNG co chuỗi/dịch dữ liệu phía sau
    const enc=new TextEncoder().encode((mode==='head'?'bone_Head':'bone_Spine')),a=b.name.lenOff,cap=vo.getInt32(a,true);
    if(enc.length>cap)throw new Error('Tên mới ('+enc.length+' byte) dài hơn tên gốc ('+cap+' byte) nên không ghi đè tại chỗ được');
    out.fill(0,a+4,a+4+cap);out.set(enc,a+4);
    v.setInt32(b.hash.off,-1197037021,true);   // hash
    v.setInt32(b.parent.off,-1541408846,true); // parent = -1541408846
  }
  const ak=({head:'red',magic:'gold',spine:'spine'})[mode],ac=ak&&$('#antOn-'+ak);
  if(ac&&ac.checked){v.setFloat32(L.male.e33.off,ANT_TAY,true);v.setFloat32(L.female.e33.off,ANT_TAY,true)} // tự tìm [4] Nam & Nữ: e33 → 500
  if(mode==='ant'){if(v.getFloat32(L.male.e33.off,true)===v.getFloat32(L.female.e33.off,true))throw new Error('e33 Nam trùng Nữ')}
  else{let same=true;for(let i=0;i<10;i++)if(v.getFloat32(L.male.el+4*i,true)!==v.getFloat32(L.female.el+4*i,true))same=false;if(same)throw new Error('Nam trùng hoàn toàn Nữ')}
  // kiểm tra cấu trúc: object Nam/Nữ phải đọc hết đúng kích thước (nếu lệch là file sẽ bị lỗi dame)
  {const keep=E.u;E.u=out;try{aiWalk(E.objs.get(AI_ID.male));aiWalk(E.objs.get(AI_ID.female))}finally{E.u=keep}}
  const fin=new Uint8Array(E.u.length);fin.set(out.subarray(0,E.u.length));return fin; // đúng bằng file gốc
}
// ---- Mã HEX Tìm / Thay cho Male [8] & Female [6]: từ trường position tới hết hash + parent, tên bù 00 cho đủ byte như bản gốc ----
const hexOf=(u,a,b)=>{let r='';for(let i=a;i<b;i++)r+=u[i].toString(16).padStart(2,'0');return r.toUpperCase()};
function hexCount(h){const p=h.match(/../g).map(x=>parseInt(x,16)),u=E.u;let n=0;for(let i=0,m=u.length-p.length;i<=m;i++){if(u[i]!==p[0])continue;let j=1;while(j<p.length&&u[i+j]===p[j])j++;if(j===p.length)n++}return n}
function aiHex(mode,k){const L=aiLoc(),out=aiBuild(mode),P=[];
  const add=(a,b)=>P.push({n:b-a,find:hexOf(E.u,a,b),rep:hexOf(out,a,b)});
  for(const g of['male','female'])add(...L[g].rng);                       // bone [8]/[6]
  const ac=$('#antOn-'+k);if(ac&&ac.checked)for(const g of['male','female'])add(...L[g].mrng); // Antena tay: Matrix4x4f [4]
  return P}
/*ENDAI*/
function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t)}t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2500)}
const bad=m=>{$('#editInfo').hidden=false;$('#editInfo').innerHTML='<span class="bad">'+m+'</span>'};
$('#cacheFile').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  $('#fileName').textContent=f.name;E.u=null;E.fr=null;E.mode='';E.dl='';$('#editInfo').hidden=false;
  ['#prevCard','#cfgCard','#panels'].forEach(s=>$(s).hidden=true);
  const buf=await f.arrayBuffer(),u=new Uint8Array(buf);
  if(String.fromCharCode(...u.subarray(0,7))!=='UnityFS'){
    const hex=[...u.subarray(0,8)].map(x=>x.toString(16).padStart(2,'0')).join(' ');
    $('#editInfo').innerHTML=`<span class="bad">Đây không phải file assetindexer (UnityFS).</span>\nKích thước: ${u.length} byte\n8 byte đầu: ${hex}`;
    return;
  }
  try{
    E.objs=parseCache(buf);E.u=u;
    if(!aiLoc()){E.u=null;bad('Không phải file assetindexer: không tìm thấy Male/Female hoặc mục [4]/[6]/[8].');return}
    E.name=f.name;E.mode='ai';E.kind='✅ Đã nhận diện file assetindexer, sẵn sàng sửa';
    aiLoadBase();
    ['#prevCard','#cfgCard','#panels'].forEach(s=>$(s).hidden=false);
    $('#editInfo').hidden=true; // ẩn bảng thông tin khi nhận diện thành công
    if(!selectedPanel)selectPanel('red');
    paint();
  }catch(err){bad('Lỗi: '+(err.message||err))}
});
document.addEventListener('click',e=>{const m=e.target.dataset&&e.target.dataset.ai;if(!m||!E.u||E.mode!=='ai')return;
  try{const out=aiBuild(m),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out]));a.download=E.name;document.body.appendChild(a);a.click();a.remove();E.dl=`✔ Đã tải ${out.length} byte — ${out.length===E.u.length?'bằng':'KHÁC'} file gốc (${E.u.length})`;aiInfo();toast(E.dl)}
  catch(err){bad('Lỗi: '+(err.message||err))}
});
// khoá phóng to/thu nhỏ (iOS Safari bỏ qua user-scalable=no nên chặn thêm bằng sự kiện)
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
const HEXALL={};
document.addEventListener('click',e=>{
  const hb=e.target.closest&&e.target.closest('[data-hex]');
  if(hb){const k=hb.dataset.k,box=$('#hex-'+k);box.hidden=false;
    if(!E.u||E.mode!=='ai'){box.innerHTML='<span class="bad">Chưa chọn file assetindexer.</span>';return}
    try{const P=aiHex(hb.dataset.hex,k);let h='',all=[];
      P.forEach((r,n)=>{const c=hexCount(r.find);all.push('Tìm: '+r.find,'Thay: '+r.rep,'');
        h+=`<div class="hl"><span>Tìm · ${r.n} byte · khớp ${c} chỗ</span><button type="button" data-copy="hx-${k}-${n}-f">Sao chép</button></div><textarea id="hx-${k}-${n}-f" readonly rows="4">${r.find}</textarea><div class="hl"><span>Thay</span><button type="button" data-copy="hx-${k}-${n}-r">Sao chép</button></div><textarea id="hx-${k}-${n}-r" readonly rows="4">${r.rep}</textarea>`});
      HEXALL[k]=all.join('\n').trim();
      box.innerHTML=`<button type="button" data-copyall="${k}" style="width:100%;min-height:40px;margin-top:10px;font-weight:700">📋 Sao chép cả danh sách (Tìm / Thay)</button>`+h}
    catch(err){box.innerHTML='<span class="bad">Lỗi: '+(err.message||err)+'</span>'}return}
  const doCopy=(txt,sel)=>{const ok=()=>toast('Đã sao chép mã HEX');
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,()=>{if(sel){sel.select();try{document.execCommand('copy')}catch(_){}}ok()});
    else{if(sel){sel.select();try{document.execCommand('copy')}catch(_){}}ok()}};
  const ca=e.target.closest&&e.target.closest('[data-copyall]');
  if(ca){doCopy(HEXALL[ca.dataset.copyall]||'');return}
  const cb=e.target.closest&&e.target.closest('[data-copy]');
  if(cb){const t=$('#'+cb.dataset.copy);t.focus();t.select();t.setSelectionRange(0,t.value.length);doCopy(t.value,t)}
});
paint();
</script>
